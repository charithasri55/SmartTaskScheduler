<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Scheduler</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Smart Task Scheduler</h1>
    <p>Plan your work and never miss a deadline</p>
</header>

<main class="container">

    <!-- Add / Edit form -->
    <section class="card">
        <h2 id="formTitle">Add New Task</h2>
        <form id="taskForm">
            <input type="hidden" id="taskId">

            <label for="title">Title *</label>
            <input type="text" id="title" maxlength="100" placeholder="Enter task title" required>

            <label for="description">Description</label>
            <textarea id="description" rows="3" maxlength="500" placeholder="Enter task description"></textarea>

            <div class="row">
                <div>
                    <label for="priority">Priority</label>
                    <select id="priority">
                        <option value="HIGH">High</option>
                        <option value="MEDIUM" selected>Medium</option>
                        <option value="LOW">Low</option>
                    </select>
                </div>
                <div>
                    <label for="deadline">Deadline *</label>
                    <input type="date" id="deadline" required>
                </div>
                <div>
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="PENDING" selected>Pending</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                </div>
            </div>

            <div class="buttons">
                <button type="submit" id="saveBtn">Add Task</button>
                <button type="button" id="cancelBtn" class="secondary hidden">Cancel Edit</button>
            </div>
        </form>
        <p id="message" class="message"></p>
    </section>

    <!-- Task list -->
    <section class="card">
        <h2>My Tasks</h2>

        <div class="toolbar">
            <div class="filters" id="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="today">Today</button>
                <button class="filter-btn" data-filter="overdue">Overdue</button>
                <button class="filter-btn" data-filter="high">High Priority</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <div class="sort-box">
                <label for="sortBy">Sort by:</label>
                <select id="sortBy">
                    <option value="newest">Newest first</option>
                    <option value="priority">Priority</option>
                    <option value="deadline">Deadline</option>
                </select>
            </div>
        </div>

        <div id="taskList"></div>
    </section>

</main>

<script src="js/app.js"></script>
</body>
</html>
